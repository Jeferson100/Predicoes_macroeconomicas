name: Coleta de Dados

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      google_trends:
        description: "Coletar Google Trends (fonte instavel)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Copia os arquivos do repo
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coleta de Dados
        working-directory: dados
        run: python rodando_coleta_dados_async.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COLETAR_GOOGLE_TRENDS: ${{ inputs.google_trends || 'false' }}

      - name: Validar qualidade dos dados
        run: python scripts/data_quality.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add dados/
          if git diff --cached --quiet; then
            echo "Sem mudancas nos dados."
            exit 0
          fi
          git commit -m "Update data: $(date +'%Y-%m-%d')"
          git push
