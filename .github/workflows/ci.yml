name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.pkl"
      - "**/*.png"
      - "**/*.html"
      - "dados/**"
      - "modelos_salvos/**"
      - "catboost_info/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copia os arquivos do repo
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar linters
        run: pip install "ruff==0.7.4" "pylint==3.3.5"

      - name: Verificar formatacao
        run: make format-check

      - name: Verificar lint
        run: make lint

  import-runtime:
    # O job de testes instala tambem as dependencias de desenvolvimento
    # (jupyterlab traz IPython), entao um import quebrado no runtime passava
    # despercebido. Foi assim que o `shap.initjs()` derrubou coleta e treino.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Copia os arquivos do repo
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar apenas o runtime
        run: pip install -r requirements.txt

      - name: Importar o pacote sem dependencias de desenvolvimento
        run: python -c "import economic_brazil; print('import ok')"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copia os arquivos do repo
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes offline
        run: make test
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
